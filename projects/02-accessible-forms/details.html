<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
  </head>
  <body>
    <h1>Registration</h1>

    <form action="#" method="post">
      <fieldset>
        <legend>Personal Information</legend>

        <div>
          <label for="name">Full Name:</label>
          <!--prettier-ignore-->
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <div>
          <label for="email">Email:</label>
          <!--prettier-ignore-->
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div>
          <label for="phone">Phone:</label>
          <!--prettier-ignore-->
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Experience Level</legend>

        <input type="radio" id="beginner" name="experience" value="beginner" />
        <label for="beginner">Beginner</label>

        <input
          type="radio"
          id="intermediate"
          name="experience"
          value="intermediate"
        />
        <label for="intermediate">Intermediate</label>

        <input type="radio" id="advanced" name="experience" value="advanced" />
        <label for="advanced">Advanced</label>
      </fieldset>

      <fieldset>
        <legend>Topics of Interest</legend>
        <!--prettier-ignore-->
        <input type="checkbox" id="html" name="skills" value="html" />
        <label for="html">HTML</label>

        <!--prettier-ignore-->
        <input type="checkbox" id="css" name="skills" value="css" />
        <label for="css">CSS</label>

        <!--prettier-ignore-->
        <input type="checkbox" id="javascript" name="skills" value="javascript" />
        <label for="javascript">JavaScript</label>
      </fieldset>

      <fieldset>
        <legend>Message</legend>
      
        <!--prettier-ignore-->
        <textarea id="message" name="message" rows="5" placeholder="Write your message..."></textarea>
      </fieldset>

      <a href="confirmation.html">continue</a>
    </form>


  </body>
</html>
